<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NOVA TECH - Web Development, Mobile Apps, AI, Cyber Security and Cloud Solutions.">
    <meta name="author" content="NOVA TECH">
    <title>NOVA TECH | Innovative Software Solutions</title>

    <!--
      This script is copied straight from the original project.
      It MUST stay inline and in <head> so it runs BEFORE the page paints,
      otherwise dark mode would flash light for a split second.
      Vue mounts after this point, so no changes needed.
    -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('nova-theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Vue replaces everything inside this element. -->
    <div id="app"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
